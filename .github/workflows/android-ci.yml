name: Android CI and Firebase

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize distributions so each push receives its own increasing version.
concurrency:
  group: android-firebase-distribution
  cancel-in-progress: false

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      FIREBASE_TESTERS: ${{ vars.FIREBASE_TESTERS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36.1 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Restore the existing Firebase installation signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.FIREBASE_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > debug.keystore
      - name: Create a disposable key for pull request checks
        if: github.event_name == 'pull_request'
        run: >-
          keytool -genkeypair -keystore debug.keystore -storepass android
          -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048
          -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Check distribution versioning and summary handling
        run: python3 -m unittest discover -s tools -p test_firebase_ci.py
      - name: Authenticate to read the latest Firebase version
        if: github.event_name != 'pull_request'
        id: version-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Choose the next version and prepare release notes
        if: github.event_name != 'pull_request'
        id: version
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.version-auth.outputs.access_token }}
        run: python3 tools/firebase_ci_version.py
      - name: Verify reader, playback, fonts and home behavior
        run: >-
          gradle testDebugUnitTest --no-daemon --console=plain
          --tests com.example.ReaderPolishTest
          --tests com.example.ReaderCorrectionsTest
          --tests com.example.ReaderFontSelectionTest
          --tests com.example.ReaderFeedbackTest
          --tests com.example.RambamAudioVisibilityTest
          --tests com.example.TanyaAudioVisibilityTest
          --tests com.example.HebrewTextNormalizerTest
          --tests com.example.HomeResumeActionsTest
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --console=plain
      - name: Save the verified APK
        uses: actions/upload-artifact@v4
        with:
          name: firebase-apk-${{ github.run_id }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Install Firebase CLI
        if: github.event_name != 'pull_request'
        run: npm install --global firebase-tools@15.10.1
      # Obtain fresh credentials after the build; GitHub OIDC tokens are short-lived.
      - name: Authenticate for distribution
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_SERVICE_ACCOUNT }}
      - name: Distribute to the existing Firebase testers
        if: github.event_name != 'pull_request'
        run: |
          firebase appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk \
            --app "$FIREBASE_APP_ID" --testers "$FIREBASE_TESTERS" \
            --release-notes-file build/firebase-release-notes.txt \
            --non-interactive --json > build/firebase-distribution.json
          python3 tools/firebase_ci_summary.py
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tests-${{ github.run_id }}
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14
